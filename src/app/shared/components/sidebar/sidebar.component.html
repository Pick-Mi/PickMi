<nav class="pm-sidebar">

  <!-- Identity block -->
  <div class="pm-sidebar__identity">
    <div class="pm-sidebar__avatar">
      <img *ngIf="usuario?.avatar_url" [src]="usuario!.avatar_url" alt="Avatar del usuario">
      <span *ngIf="!usuario?.avatar_url">
        {{ (usuario?.nombre?.charAt(0) || 'A').toUpperCase() }}
      </span>
    </div>
    <h4 class="pm-sidebar__welcome">Bienvenido</h4>
    <p class="pm-sidebar__name">{{ usuario?.nombre || 'Usuario' }} {{ usuario?.apellido || '' }}</p>
    <span class="pm-sidebar__role">Administrador</span>
  </div>

  <!-- Platform group -->
  <div class="pm-sidebar__group">
    <span class="pm-sidebar__group-label">Plataforma</span>
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" class="pm-sidebar__item">
      <i class="fa-solid fa-gauge-high"></i>
      <span>Dashboard</span>
    </a>
    <a routerLink="/configurations" routerLinkActive="active" class="pm-sidebar__item">
      <i class="fa-solid fa-gear"></i>
      <span>Configuraciones</span>
    </a>
    <a routerLink="/reports" routerLinkActive="active" class="pm-sidebar__item">
      <i class="fa-solid fa-chart-line"></i>
      <span>Reportes</span>
    </a>
    <a routerLink="/messages" routerLinkActive="active" class="pm-sidebar__item">
      <i class="fa-solid fa-envelope-open-text"></i>
      <span>Mensajes</span>
    </a>
  </div>

  <!-- Community group -->
  <div class="pm-sidebar__group">
    <span class="pm-sidebar__group-label">Comunidad</span>
    <a routerLink="/users-list" routerLinkActive="active" class="pm-sidebar__item">
      <i class="fa-solid fa-users"></i>
      <span>Usuarios</span>
    </a>
    <a routerLink="/owners-list" routerLinkActive="active" class="pm-sidebar__item">
      <i class="fa-solid fa-user-check"></i>
      <span>Propietarios</span>
    </a>
    <a routerLink="/stores-list" routerLinkActive="active" class="pm-sidebar__item">
      <i class="fa-solid fa-store"></i>
      <span>Comercios</span>
    </a>
    <a routerLink="/reviews" routerLinkActive="active" class="pm-sidebar__item">
      <i class="fa-solid fa-comments"></i>
      <span>Reseñas</span>
    </a>
  </div>

</nav>
