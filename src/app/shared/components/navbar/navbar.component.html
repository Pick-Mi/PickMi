<!-- ============================================================== -->
<!-- Top header  -->
<!-- ============================================================== -->
<!-- Start Navigation -->
<div class="header header-dark navdark" data-sticky-element="">
  <div class="container-fluid">
    <nav id="navigation" class="navigation navigation-landscape">
      <div class="nav-header d-flex justify-content-between align-items-center">
        <a class="nav-brand" href="#">
          <img src="assets/img/logo-light.svg" style="height: 50px;" class="logo" alt="">
        </a>

        <!-- Botón de menú solo en móvil -->
        <button class="navbar-toggler d-lg-none btn" type="button" (click)="toggleMenu()">
          <i class="bi bi-list fs-2 text-white"></i>
        </button>
      </div>

      <!-- Menú normal para escritorio -->
      <div class="nav-menus-wrapper d-none d-lg-flex justify-content-between">
        <ul class="nav-menu">
          <li class="active">
            <a href="https://dev-pickmi-web.web.app" target="_blank" rel="noopener noreferrer">
              Sitio Principal
            </a>
          </li>
        </ul>

        <ul class="nav-menu nav-menu-social align-to-right">
          <li class="list-buttons">
            <a (click)="logout()"><i class="bi bi-door-open fs-6 me-1"></i>Cerrar Sesión</a>
          </li>
        </ul>
      </div>
    </nav>
  </div>

  <!-- Menú móvil personalizado -->
  <div class="mobile-menu bg-dark text-white" [class.active]="menuAbierto">
    <ul class="list-unstyled p-4">
      <li class="mb-3"><a class="text-white" style="cursor: pointer;" routerLink="/" (click)="menuAbierto = false">
        <i class="bi bi-speedometer me-2"></i>Dashboard</a>
      </li>
      <li class="mb-3"><a class="text-white" style="cursor: pointer;" routerLink="/profile" (click)="menuAbierto = false">
        <i class="bi bi-person-lines-fill me-2"></i>Mi Perfil</a>
      </li>
      <li class="mb-3"><a class="text-white" style="cursor: pointer;" routerLink="/stores-list" (click)="menuAbierto = false">
        <i class="bi bi-cart-check me-2"></i>Mis Locales</a>
      </li>
      <li class="mb-3"><a class="text-white" style="cursor: pointer;" routerLink="/menus-list" (click)="menuAbierto = false">
        <i class="bi bi-journal-check me-2"></i>Mis Productos</a>
      </li>
      <li class="mb-3"><a class="text-white" style="cursor: pointer;" routerLink="/schedule-list" (click)="menuAbierto = false">
        <i class="bi bi-clock me-2"></i>Horarios de Locales</a>
      </li>
      <li class="mb-3"><a class="text-white" style="cursor: pointer;" routerLink="/gallery-list" (click)="menuAbierto = false">
        <i class="bi bi-camera me-2"></i>Mi Galería</a>
      </li>
      <li class="mb-3"><a class="text-white" style="cursor: pointer;" routerLink="/reviews-list" (click)="menuAbierto = false">
        <i class="bi bi-chat-text me-2"></i>Mis Reseñas</a>
      </li>
      <li><a class="text-white" style="cursor: pointer;" (click)="logout()">
        <i class="bi bi-door-open fs-6 me-1"></i>Cerrar sesión</a>
      </li>
    </ul>
  </div>
</div>

<!-- End Navigation -->
