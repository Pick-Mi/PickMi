<header class="pm-navbar">
  <div class="pm-navbar__brand">
    <img src="assets/img/logo-light.svg" alt="Pickmi" class="pm-navbar__logo">
  </div>

  <div class="pm-navbar__actions">
    <a href="https://dev-pickmi-web.web.app" target="_blank" rel="noopener noreferrer" class="pm-navbar__link">
      <i class="bi bi-box-arrow-up-right"></i>
      Sitio Principal
    </a>
    <button class="pm-navbar__logout" type="button" (click)="logout()">
      <i class="bi bi-door-open"></i>
      Cerrar Sesión
    </button>
  </div>

  <button class="pm-navbar__toggle" type="button" (click)="toggleMenu()" aria-label="Abrir menú">
    <i class="bi bi-list"></i>
  </button>
</header>

<nav class="pm-mobile-nav" [class.pm-mobile-nav--open]="menuAbierto" (click)="menuAbierto = false">
  <a routerLink="/" class="pm-mobile-nav__item"><i class="fa-solid fa-gauge-high"></i> Dashboard</a>
  <a routerLink="/configurations" class="pm-mobile-nav__item"><i class="fa-solid fa-gear"></i> Configuraciones</a>
  <a routerLink="/reports" class="pm-mobile-nav__item"><i class="fa-solid fa-chart-line"></i> Reportes</a>
  <a routerLink="/messages" class="pm-mobile-nav__item"><i class="fa-solid fa-envelope-open-text"></i> Mensajes</a>
  <a routerLink="/users-list" class="pm-mobile-nav__item"><i class="fa-solid fa-users"></i> Usuarios</a>
  <a routerLink="/owners-list" class="pm-mobile-nav__item"><i class="fa-solid fa-user-check"></i> Propietarios</a>
  <a routerLink="/stores-list" class="pm-mobile-nav__item"><i class="fa-solid fa-store"></i> Comercios</a>
  <a routerLink="/reviews" class="pm-mobile-nav__item"><i class="fa-solid fa-comments"></i> Reseñas</a>
  <button class="pm-mobile-nav__item pm-mobile-nav__item--logout" type="button" (click)="logout()">
    <i class="bi bi-door-open"></i> Cerrar Sesión
  </button>
</nav>
