<section>
  <div class="container">
    <div class="row align-items-center justify-content-center">
      <div class="col-xl-5 col-lg-7 col-md-9">
        <div class="authWrap">

          <div class="authhead">
            <div class="text-center mb-4">
              <a routerLink="/"><img class="img-fluid" src="assets/img/icon.png" width="55" alt="logo"></a>
            </div>
          </div>

          <div class="authbody d-black mb-4">
            <div class="card rounded-4 p-sm-5 p-4">
              <div class="card-body p-0">

                <div class="text-center mb-4">
                  <h1 class="mb-2 fs-2">Nueva contraseña</h1>
                  <p class="text-muted fs-6">Elige una contraseña segura para tu cuenta.</p>
                </div>

                <!-- Contraseña actualizada -->
                <div *ngIf="listo" class="text-center py-3">
                  <i class="bi bi-check-circle fs-1 text-success d-block mb-3"></i>
                  <p class="fw-medium">¡Contraseña actualizada!</p>
                  <p class="text-muted small">Serás redirigido al inicio de sesión en unos segundos...</p>
                </div>

                <!-- Esperando token de Supabase -->
                <div *ngIf="!listo && !recoveryReady" class="text-center py-4 text-muted">
                  <div class="spinner-border spinner-border-sm me-2"></div>
                  Verificando enlace...
                </div>

                <!-- Formulario -->
                <form *ngIf="!listo && recoveryReady" [formGroup]="form" (ngSubmit)="onSubmit()" class="mt-4 text-start">

                  <div class="form-group position-relative mb-4">
                    <label>Nueva contraseña</label>
                    <div class="position-relative">
                      <input [type]="showPassword ? 'text' : 'password'" class="form-control pe-5"
                             formControlName="password" placeholder="Mínimo 6 caracteres">
                      <button
                        type="button"
                        class="btn btn-link password-toggle-btn text-decoration-none position-absolute top-50 end-0 translate-middle-y pe-3"
                        (click)="togglePasswordVisibility()"
                        aria-label="Mostrar u ocultar contraseña">
                        <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                      </button>
                    </div>
                    <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-danger small mt-1">
                      Mínimo 6 caracteres.
                    </div>
                  </div>

                  <div class="form-group position-relative mb-4">
                    <label>Confirmar contraseña</label>
                    <div class="position-relative">
                      <input [type]="showConfirm ? 'text' : 'password'" class="form-control pe-5"
                             formControlName="confirm" placeholder="Repite la contraseña">
                      <button
                        type="button"
                        class="btn btn-link password-toggle-btn text-decoration-none position-absolute top-50 end-0 translate-middle-y pe-3"
                        (click)="toggleConfirmVisibility()"
                        aria-label="Mostrar u ocultar contraseña">
                        <i class="bi" [ngClass]="showConfirm ? 'bi-eye-slash-fill' : 'bi-eye-fill'"></i>
                      </button>
                    </div>
                    <div *ngIf="form.errors?.['noCoinciden'] && confirm.touched" class="text-danger small mt-1">
                      Las contraseñas no coinciden.
                    </div>
                  </div>

                  <div class="form-group mb-3">
                    <button type="submit" class="btn btn-primary full-width fw-medium" [disabled]="cargando">
                      <span *ngIf="cargando" class="spinner-border spinner-border-sm me-2"></span>
                      Guardar contraseña
                    </button>
                  </div>

                </form>

              </div>
            </div>
          </div>

          <div class="authfooter">
            <div class="text-center">
              <p class="text-dark mb-0"><a routerLink="/auth/login" class="fw-medium text-primary">Volver al inicio de sesión</a></p>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
</section>
