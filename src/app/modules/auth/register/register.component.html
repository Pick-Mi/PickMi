<!-- ============================ Registro Reactivo Start ================================== -->
<section>
    <div class="container">
      <div class="row align-items-center justify-content-center">
        <div class="col-xl-5 col-lg-7 col-md-9">
          <div class="authWrap">
  
            <div class="authhead">
              <div class="text-center mb-4">
                <a routerLink="/"><img class="img-fluid" src="assets/img/icon.png" width="55" alt="logo"></a>
              </div>
            </div>
  
            <div class="authbody d-black mb-4">
              <div class="card rounded-4 p-sm-5 p-4">
                <div class="card-body p-0">
  
                  <!-- Title -->
                  <div class="text-center"><h1 class="mb-2 fs-2">Crea tu cuenta <br> PickMi Negocios</h1></div>
  
                  <!-- Form START -->
                  <form [formGroup]="registroForm" (ngSubmit)="onRegister()" class="mt-5 text-start">
                    
                    <div class="form mb-3">
                      <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" formControlName="email" placeholder="name@example.com">
                        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger">
                          Email válido requerido.
                        </div>
                      </div>
  
                      <div class="form-group">
                        <label class="form-label">Password</label>
                        <div class="position-relative">
                          <input type="password" class="form-control" formControlName="password" placeholder="Password">
                        </div>
                      </div>
  
                      <div class="form-group">
                        <label class="form-label">Confirma tu Password</label>
                        <input type="password" class="form-control" formControlName="confirmPassword" placeholder="*********">
                        <div *ngIf="registroForm.hasError('passwordMismatch') && registroForm.get('confirmPassword')?.touched" class="text-danger">
                          Las contraseñas no coinciden.
                        </div>
                      </div>
  
                      <div class="form-group mb-4">
                        <button type="submit" [disabled]="registroForm.invalid" class="btn btn-dark full-width fw-medium">Crear cuenta</button>
                      </div>
                    </div>
    
                  </form>
                  <!-- Form END -->
  
                </div>
              </div>
            </div>
  
            <div class="authfooter">
              <div class="text-center">
                <p class="text-dark mb-0">Ya posees una cuenta de empresa? <a routerLink="/auth/login" class="fw-medium text-primary">Ingresa acá</a></p>
              </div>
            </div>
  
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- ============================ Registro Reactivo End ================================== -->
