<!-- ============================ Login Form Start ================================== -->
<section>
    <div class="container">
      <div class="row align-items-center justify-content-center">
        <div class="col-xl-5 col-lg-7 col-md-9">
          <div class="authWrap">
  
            <div class="authhead">
              <div class="text-center mb-4">
                <a routerLink="/"><img class="img-fluid" src="assets/img/icon.png" width="55" alt="logo"></a>
              </div>
            </div>
  
            <div class="authbody d-black mb-4">
              <div class="card rounded-4 p-sm-5 p-4">
                <div class="card-body p-0">
  
                  <!-- Title -->
                  <div class="text-center"><h1 class="mb-2 fs-2">Bienvenido a <br> PickMi Admin</h1></div>
  
                  <!-- Form START -->
                  <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="mt-5 text-start">
  
                    <div class="form mb-5">
                      <div class="form-group mb-4">
                        <label>Usuario</label>
                        <input type="email" class="form-control" formControlName="email" placeholder="name@example.com" required>
                        <div *ngIf="email.invalid && (email.dirty || email.touched)" class="text-danger">
                          Email válido requerido.
                        </div>
                      </div>
  
                      <div class="form-group position-relative mb-4">
                        <label>Password</label>
                        <div class="position-relative">
                          <input type="password" class="form-control" formControlName="password" placeholder="Password">
                        </div>
                        <div *ngIf="password.invalid && (password.dirty || password.touched)" class="text-danger">
                          Contraseña requerida.
                        </div>
                      </div>
  
                      <div class="form-group mb-4">
                        <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary full-width fw-medium">Ingresar</button>
                      </div>
                    </div>
  
                  </form>
                  <!-- Form END -->
  
                </div>
              </div>
            </div>
  
            <div class="authfooter">
              <div class="text-center">
                <p class="text-dark mb-0">¿Eres nuevo? <a routerLink="/auth/register" class="fw-medium text-primary">Crea una cuenta</a></p>
              </div>
            </div>
  
          </div>
        </div>
      </div>
    </div>
  </section>
  <!-- ============================ Login Form End ================================== -->
