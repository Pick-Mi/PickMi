<!-- Dashboard Content -->
<div class="user-dashboard-box bg-light">

  <!-- Dashboard Title -->
  <div class="dashHeader p-xl-5 p-4 pb-xl-0 pb-0">
    <h2 class="mb-0">Perfil del propietario</h2>
  </div>

  <!-- Dashboard Details -->
  <div class="dashCaption p-xl-5 p-4">
    <form *ngIf="perfilForm" [formGroup]="perfilForm" (ngSubmit)="onSubmit()">
      <div class="row align-items-start g-4 mb-lg-5 mb-4">

        <!-- Formulario de información -->
        <div class="col-xl-8 col-lg-8 col-md-8">
          <div class="card rounded-3 shadow-sm mb-lg-5 mb-4">
            <div class="card-header px-4 py-3">
              <h4 class="fs-5 fw-medium"><i class="bi bi-info-circle text-primary me-2"></i>Información básica</h4>
						</div>
            <div class="card-body p-4">
              <div class="row align-items-start">
                <div class="col-xl-6">
                  <div class="form-group">
                    <label>Nombres</label>
                    <input type="text" class="form-control" formControlName="nombre" placeholder="Ej. Alberto Antonio">
                  </div>
                </div>

                <div class="col-xl-6">
                  <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" class="form-control" formControlName="apellido" placeholder="Ej. Lopez Gonzalez">
                  </div>
                </div>

                <div class="col-xl-6">
                  <div class="form-group">
                    <label>Teléfono</label>
                    <input type="tel" class="form-control" formControlName="telefono" placeholder="Ej. 7777-8888">
                  </div>
                </div>

                <div class="col-xl-6">
                  <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" formControlName="email">
                  </div>
                </div>

                <div class="col-12 mt-4">
                  <button class="btn btn-primary w-100" type="submit" [disabled]="perfilForm.invalid">
                    Guardar y continuar
                  </button>
                </div>

              </div>
            </div>
          </div>
        </div>

        <!-- Avatar -->
        <div class="col-xl-4 col-lg-4 col-md-5">
          <div class="card rounded-3 shadow-sm">
            <div class="card-header px-4 py-3">
              <h4 class="fs-5 fw-medium"><i class="bi bi-image text-primary me-2"></i>Imagen de perfil</h4>
            </div>
            <div class="card-body py-5 p-4">
              
              <div *ngIf="!showCropper">
                <!-- Avatar actual -->
                <div class="text-center mb-3">
                  <img [src]="avatarUrl" class="rounded-circle" width="150" height="150" alt="Avatar">
                </div>

                <!-- Input de imagen -->
                <div class="mb-3 text-center">
                  <button class="btn btn-md btn-light-primary fw-medium" type="button" (click)="fileInput.click()">Cambiar imagen</button>
                  <input #fileInput type="file" accept="image/*" (change)="onAvatarChange($event)" style="display: none">
                </div>
              </div>

              <!-- Cropper -->
              <div *ngIf="showCropper" class="animated fadeIn">
                <image-cropper
                  [imageChangedEvent]="imageChangedEvent"
                  [maintainAspectRatio]="true"
                  [resizeToWidth]="500"
                  [aspectRatio]="1"
                  format="png"
                  (imageCropped)="imageCropped($event)">
                </image-cropper>

                <div class="text-center mt-3">
                  <button class="btn btn-primary me-2 w-100" type="button" (click)="guardarAvatarCortado()" [disabled]="isUploading || !croppedImage">
                    <span *ngIf="isUploading" class="spinner-border spinner-border-sm me-1"></span>
                    Guardar Imagen
                  </button>
                  
                </div>
                <div class="text-center mt-3">
                  <button class="btn btn-secondary w-100" type="button" (click)="showCropper = false">
                    Cancelar
                  </button>
                </div>
              </div>

            </div>
          </div>
        </div>

      </div>
    </form>
  </div>

</div>
