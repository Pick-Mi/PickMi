<div class="user-dashboard-box bg-light">
    <div class="dashHeader p-xl-5 p-4 pb-xl-0 pb-0 d-flex justify-content-between align-items-center">
        <h2 class="mb-0">
            Configuración de horarios
        </h2>
    </div>

    <div class="dashCaption p-xl-5 p-4">
        <div class="row align-items-start g-4 mb-lg-5 mb-4">
            <div class="col-xl-7 col-lg-7 col-md-7">

                <div class="card rounded-3 shadow-sm mb-lg-5 mb-4">
                    <div class="card-header py-4 px-4">
                        <h4 class="fs-5 fw-medium"><i class="bi bi-stopwatch text-primary me-2"></i>{{ nombreComercio }}</h4>
                    </div>
                    <div class="card-body p-4">
                        <div class="row">
                            <form (ngSubmit)="guardar()" class="space-y-4">
                                <div *ngFor="let dia of diasSemana; let i = index" class="flex items-center gap-4">
                                    <div class="col-12 mb-3">
                                        <div class="form-group d-flex">
                                            
                                            <div class="col-3">
                                                <div class="form-group">
                                                    <label class="w-32">{{ dia.nombre }}</label>
                                                </div>
                                            </div>

                                            <div class="col-3">
                                                <div class="form-group">
                                                    <input type="time"
                                                    [(ngModel)]="dia.hora_apertura"
                                                    [disabled]="dia.cerrado"
                                                    name="apertura-{{ i }}"
                                                    class="form-input" />
                                                </div>
                                            </div>

                                            <div class="col-3">
                                                <div class="form-group">
                                                    <input type="time"
                                                    [(ngModel)]="dia.hora_cierre"
                                                    [disabled]="dia.cerrado"
                                                    name="cierre-{{ i }}"
                                                    class="form-input" />
                                                </div>
                                            </div>

                                            <div class="col-3">
                                                <div class="form-check">
                                                    <input class="form-check-input" type="checkbox" [(ngModel)]="dia.cerrado" name="cerrado-{{ i }}" />
                                                    <label class="flex items-center gap-2">Cerrado</label>
                                                </div>
                                            </div>
                                                                                        
                                        </div>    
                                    </div>        
                                </div>

                                <div class="col-12 mt-5 mb-2 d-flex w-100">
                                    <button class="btn btn-secondary w-50 me-2" type="button" (click)="onCancel()">Cancelar</button>
                                    <button class="btn btn-primary w-50" type="submit">Guardar horarios</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    
    

</div>
