<div class="page-wrapper cfg">

  <!-- Header -->
  <div class="page-header">
    <p class="cfg__eyebrow">Configuraciones</p>
    <h2>Configuraciones de la plataforma</h2>
    <p>Gestiona los elementos clave del sitio desde un solo lugar.
      Estos ajustes alimentan tanto la app de propietarios como la app pública.</p>
  </div>

  <!-- Groups -->
  <div *ngFor="let group of groups" class="cfg__section">
    <div class="cfg__section-head">
      <p class="cfg__section-title">{{ group.label }}</p>
      <p class="cfg__section-sub">{{ group.subtitle }}</p>
    </div>

    <div class="cfg__grid">
      <button
        *ngFor="let item of group.items"
        type="button"
        class="cfg__card"
        (click)="goTo(item.link)">
        <div class="cfg__icon-box">
          <i [ngClass]="item.icon"></i>
        </div>
        <p class="cfg__card-title">{{ item.label }}</p>
        <p class="cfg__card-desc">{{ item.description }}</p>
      </button>
    </div>
  </div>

</div>
