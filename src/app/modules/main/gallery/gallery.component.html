<div class="user-dashboard-box bg-light">
								
	<!-- Dashboard Title -->
	<div class="dashHeader p-xl-5 p-4 pb-xl-0 pb-0">
		<h2 class="mb-0">Mi Galería de Imagenes</h2>
	</div>
	
	<!-- Dashboard Details -->
	<div class="dashCaption p-xl-5 p-4">
		
		<!-- Row Start -->
		<div class="row align-items-start g-4 mb-lg-5 mb-4">
			<div class="col-xl-12 col-lg-12 col-md-12">
				<div class="card rounded-3 shadow-sm">
					<div class="card-header px-4 py-3">
						<h4 class="fs-5 fw-medium"><i class="bi bi-image text-primary me-2"></i>{{ nombreComercio }}</h4>
					</div>
					<div class="card-body p-0">
						
            <div class="p-4 max-w-5xl mx-auto">

              <!-- Subida de imágenes -->
              <div class="d-grid gap-3 mb-3" style="
                                grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
                                grid-auto-rows: 240px;
                                max-width: 100%;
                              ">
                <div *ngFor="let preview of previews; let i = index" class="position-relative border rounded shadow-sm"
                  style="overflow: hidden;">
                  <img [src]="preview" alt="Preview" class="w-100 h-100 object-fit-cover" />
                  <button
                    class="btn btn-danger btn-sm rounded-circle position-absolute top-0 end-0 m-1 p-0 d-flex align-items-center justify-content-center"
                    style="width: 24px; height: 24px; font-size: 14px;" (click)="removeImage(i)" title="Eliminar">
                    ×
                  </button>
                </div>                
              </div>

              <!-- Selector de archivos -->
              <div
                class="border border-dashed rounded text-center w-100 py-4 px-3"
                [ngClass]="{
                  'text-muted': files.length + galleryItems.length < maxImages,
                  'border-danger text-danger': files.length + galleryItems.length >= maxImages
                }"
              >
                <ng-container *ngIf="files.length + galleryItems.length < maxImages; else limitReached">
                  <div class="mb-2">
                    <i class="bi bi-images" style="font-size: 2rem;"></i>
                  </div>
                  <div class="fw-semibold">Selecciona las imágenes que deseas cargar</div>
                  <small class="d-block mt-1">(Máximo 6 imágenes en total)</small>

                  <!-- Input visible pero estilizado -->
                  <div class="mt-3">
                    <label class="btn btn-outline-primary">
                      <i class="bi bi-upload me-1"></i> Elegir imágenes
                      <input type="file" accept="image/*" multiple (change)="onFileSelected($event)" hidden />
                    </label>
                  </div>
                </ng-container>

                <ng-template #limitReached>
                  <div class="mb-2">
                    <i class="bi bi-lock-fill text-danger" style="font-size: 2rem;"></i>
                  </div>
                  <div class="fw-semibold text-danger">Has alcanzado el máximo de imágenes permitidas.</div>
                </ng-template>
              </div>



              <div class="col-12 mt-4 d-flex align-items-center justify-content-center w-100">
                <button class="btn btn-secondary me-2" type="button" (click)="onCancel()">Cancelar</button>
                <button class="btn btn-primary d-flex align-items-center justify-content-center gap-2" type="button"
                  [disabled]="isUploading || files.length === 0" (click)="uploadImages()">
                  <ng-container *ngIf="isUploading; else defaultText">
                    <span class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
                    Subiendo...
                  </ng-container>
                  <ng-template #defaultText>Subir Imágenes</ng-template>
                </button>

              </div>
            </div>
					</div>
				</div>

        <!-- Imagenes Actuales -->
          <div class="card rounded-3 shadow-sm mt-5" *ngIf="galleryItems.length > 0">
            <div class="card-header py-3 px-4">
                <h4 class="fs-5 fw-medium"><i class="bi bi-images text-primary me-2"></i>Imágenes actuales</h4>
            </div>
            <div class="card-body p-4">
              <div class="row">
                <div class="col-md-12">
                  <div class="d-flex flex-row gap-3 overflow-auto py-2 justify-content-center" style="max-width: 100%;">
                    <div *ngFor="let img of galleryItems" class="position-relative border rounded shadow-sm"
                      style="width: 120px; height: 120px; flex: 0 0 auto; overflow: hidden;">
                      <img [src]="img.url_imagen" alt="Imagen comercio" class="w-100 h-100 object-fit-cover" />
                      <button
                        class="btn btn-danger btn-sm rounded-circle position-absolute top-0 end-0 m-1 p-0 d-flex align-items-center justify-content-center"
                        style="width: 24px; height: 24px; font-size: 14px;" (click)="deleteImage(img)" title="Eliminar">
                        ×
                      </button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>

			</div>
			
		</div>
		<!-- Row End -->
											
	</div>
	
</div>
