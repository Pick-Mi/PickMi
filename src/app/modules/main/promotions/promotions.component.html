<div class="page-wrapper">
  <app-back-button [link]="'/configurations/promotions/list'" label="Regresar a Promociones"></app-back-button>

  <div class="page-header">
    <p class="pr__eyebrow">Configuraciones · Catálogo</p>
    <h2>{{ editingId ? 'Editar promoción' : 'Nueva promoción' }}</h2>
    <p>Define la vigencia, precios e imagen de la promoción.</p>
  </div>

  <form class="pm-card pr__form-card" [formGroup]="form" (ngSubmit)="submit()">

    <div class="pr__layout">

      <!-- Image upload -->
      <div class="pr__upload-col">
        <p class="pr__section-label">Imagen</p>
        <div class="pr__square-hint">
          <i class="fa-solid fa-circle-info"></i>
          La imagen debe ser cuadrada (1:1)
        </div>
        <label class="pr__upload-area" *ngIf="!cropperVisible">
          <input type="file" accept="image/*" (change)="onFileChange($event)">
          <ng-container *ngIf="croppedPreview; else emptyPreview">
            <img [src]="croppedPreview" alt="Vista previa">
          </ng-container>
          <ng-template #emptyPreview>
            <div class="pr__upload-placeholder">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span>Selecciona una imagen</span>
            </div>
          </ng-template>
        </label>

        <div class="pr__cropper" *ngIf="cropperVisible">
          <image-cropper
            [imageChangedEvent]="imageChangedEvent"
            [maintainAspectRatio]="cropMaintainRatio"
            [aspectRatio]="cropAspectRatio"
            [format]="cropFormat"
            [output]="cropOutput"
            [resizeToWidth]="cropSize"
            [resizeToHeight]="cropSize"
            (imageCropped)="imageCropped($event)">
          </image-cropper>
          <div class="pr__cropper-actions">
            <button class="btn--primary btn--sm" type="button" (click)="cropperVisible = false">
              <i class="fa-solid fa-check"></i> Listo
            </button>
            <button class="btn--ghost btn--sm" type="button" (click)="cancelCropper()">Cancelar</button>
          </div>
        </div>
      </div>

      <!-- Fields -->
      <div class="pr__fields-col">

        <!-- Tipo de promoción — siempre visible y primero -->
        <div class="pr__field pr__field--full">
          <label class="pr__field-label">Tipo de promoción <span class="pr__required">*</span></label>
          <div class="pr__tipo-pills">
            <button type="button" class="pr__tipo-pill"
              [class.pr__tipo-pill--active]="tipoActual === 'descuento'"
              (click)="form.get('tipo_promocion')?.setValue('descuento')">
              <i class="fa-solid fa-tag"></i> Descuento
            </button>
            <button type="button" class="pr__tipo-pill"
              [class.pr__tipo-pill--active]="tipoActual === 'regalo'"
              (click)="form.get('tipo_promocion')?.setValue('regalo')">
              <i class="fa-solid fa-gift"></i> Regalo
            </button>
            <button type="button" class="pr__tipo-pill"
              [class.pr__tipo-pill--active]="tipoActual === '2x1'"
              (click)="form.get('tipo_promocion')?.setValue('2x1')">
              <i class="fa-solid fa-certificate"></i> 2x1
            </button>
            <button type="button" class="pr__tipo-pill"
              [class.pr__tipo-pill--active]="tipoActual === 'bundle'"
              (click)="form.get('tipo_promocion')?.setValue('bundle')">
              <i class="fa-solid fa-boxes-stacked"></i> Bundle
            </button>
          </div>
        </div>

        <div class="pr__form-grid">
          <div class="pr__field">
            <label class="pr__field-label">Comercio <span class="pr__required">*</span></label>
            <div class="pr__select-wrap">
              <select class="pr__select" formControlName="comercio_id">
                <option value="">Selecciona un comercio</option>
                <option *ngFor="let c of comercios" [value]="c.id">{{ c.nombre }}</option>
              </select>
              <i class="fa-solid fa-chevron-down pr__select-icon"></i>
            </div>
          </div>

          <div class="pr__field">
            <label class="pr__field-label">Título <span class="pr__required">*</span></label>
            <input type="text" class="pr__input" formControlName="titulo" maxlength="200" placeholder="Ej. 2x1 en café">
          </div>

          <div class="pr__field">
            <label class="pr__field-label">Código</label>
            <input type="text" class="pr__input pr__input--mono" formControlName="codigo_promocion" readonly>
          </div>

          <div class="pr__field">
            <label class="pr__field-label">Estatus</label>
            <div class="pr__select-wrap">
              <select class="pr__select" formControlName="estatus">
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
                <option value="borrado">Borrado</option>
              </select>
              <i class="fa-solid fa-chevron-down pr__select-icon"></i>
            </div>
          </div>

          <div class="pr__field">
            <label class="pr__field-label">Fecha inicio <span class="pr__required">*</span></label>
            <input type="datetime-local" class="pr__input" formControlName="fecha_inicio">
          </div>

          <div class="pr__field">
            <label class="pr__field-label">Fecha fin <span class="pr__required">*</span></label>
            <input type="datetime-local" class="pr__input" formControlName="fecha_fin">
          </div>

          <div class="pr__field">
            <label class="pr__field-label">Precio original <span class="pr__required">*</span></label>
            <input type="number" step="0.01" min="0" class="pr__input" formControlName="precio_original">
          </div>

          <div class="pr__field" *ngIf="requierePrecioPromo">
            <label class="pr__field-label">Precio promoción <span class="pr__required">*</span></label>
            <input type="number" step="0.01" min="0" class="pr__input" formControlName="precio_promocion">
          </div>

          <div class="pr__field" *ngIf="tipoActual === 'descuento'">
            <label class="pr__field-label">% Descuento <span class="pr__field-hint-inline">(calculado automáticamente)</span></label>
            <input type="number" class="pr__input" [value]="porcentajeDescuento ?? ''" readonly>
          </div>

          <div class="pr__field" *ngIf="requiereItemRegalo">
            <label class="pr__field-label">Artículo de regalo <span class="pr__required">*</span></label>
            <input type="text" class="pr__input" formControlName="item_regalo" placeholder="Ej. Zaranda de aluminio">
          </div>
        </div>

        <div class="pr__field pr__field--full">
          <label class="pr__field-label">Descripción</label>
          <textarea class="pr__input pr__textarea" rows="3" formControlName="descripcion"
            placeholder="Detalles adicionales…"></textarea>
        </div>

        <div class="pr__form-actions">
          <button type="submit" class="btn--primary" [disabled]="saving || form.invalid">
            {{ saving ? 'Guardando…' : (editingId ? 'Actualizar promoción' : 'Crear promoción') }}
          </button>
          <button type="button" class="btn--ghost" (click)="resetForm()">Cancelar</button>
        </div>

      </div>
    </div>

  </form>
</div>
