<div class="page-wrapper">

  <div class="rpt__header">
    <div class="page-header">
      <p class="rpt__eyebrow">Reportes</p>
      <h2>Generación de reportes</h2>
      <p>Genera informes para entender el crecimiento, la reputación y el impacto de los negocios suscritos.</p>
    </div>
    <button class="btn--primary rpt__export" type="button">
      <i class="fa-solid fa-file-export"></i>
      Exportar todo
    </button>
  </div>

  <div class="rpt__grid">
    <article
      class="rpt__card"
      *ngFor="let reporte of reportes"
      (click)="ejecutarReporte(reporte)">

      <div class="rpt__card-top">
        <div class="rpt__icon"
          [style.background]="reporte.iconBg"
          [style.color]="reporte.iconColor">
          <i [ngClass]="reporte.iconClass"></i>
        </div>
      </div>

      <div class="rpt__card-body">
        <h3 class="rpt__card-title">{{ reporte.title }}</h3>
        <p class="rpt__card-desc">{{ reporte.description }}</p>
      </div>

      <div class="rpt__card-footer">
        <span class="rpt__link">
          Generar reporte
          <i class="fa-solid fa-arrow-up-right-from-square"></i>
        </span>
        <button class="rpt__dots" type="button" (click)="$event.stopPropagation()">
          <i class="fa-solid fa-ellipsis"></i>
        </button>
      </div>

    </article>
  </div>

</div>
