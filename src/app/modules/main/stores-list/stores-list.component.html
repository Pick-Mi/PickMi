<div class="user-dashboard-box bg-light">
  <div class="dashHeader p-xl-5 p-4 pb-xl-0 pb-0 d-flex justify-content-between align-items-center">
    <!-- Título -->
    <h2 class="mb-0">Mis Locales</h2>
    <!-- Botón -->
    <button class="btn btn-sm btn-mustard" (click)="onCreate()"><i class="bi bi-plus-circle fs-6 me-2"></i>Crear Local</button>
  </div>

  <div class="dashCaption p-xl-5 p-4">

    <div class="card rounded-3 shadow-sm mb-lg-5 mb-4">
      <div class="card-header py-3 px-4">
        <h4 class="fs-5 fw-medium"><i class="bi bi-shop text-primary me-2"></i>Locales registrados</h4>
      </div>
       <div class="card-body shadow-sm rounded-3 p-4">

          <!-- Mostrar mensaje si está vacío -->
          <div *ngIf="!rows?.length && !loading" class="text-center text-muted py-4">
            Aún no tienes locales registrados. Haz clic en "Crear Local" para comenzar.
          </div>

          <!-- Mostrar datatable si hay registros -->
          <ngx-datatable
            *ngIf="rows?.length"
              class="bootstrap"
              [rows]="rows"
              [columns]="[]"
              [columnMode]="'force'"
              [headerHeight]="50"
              [footerHeight]="50"
              [rowHeight]="'auto'"
              [loadingIndicator]="loading">
              
              <ngx-datatable-column name="Nombre" prop="nombre"></ngx-datatable-column>
              <ngx-datatable-column name="Ubicacion" prop="direccion" [width]="250"></ngx-datatable-column>
              <ngx-datatable-column name="Teléfono" prop="telefono" [width]="50" *ngIf="!isMobile"></ngx-datatable-column>
              <ngx-datatable-column name="Email" prop="email" *ngIf="!isMobile"></ngx-datatable-column>
              <ngx-datatable-column name="Acciones" [width]="160">
                <ng-template let-row="row" ngx-datatable-cell-template>
                    <div class="botones-acciones">
                      <button class="btn btn-sm btn-expand btn-secondary me-2" (click)="onPreview(row)">
                        <i class="bi bi-search"></i>
                        <span class="btn-label">Vista Previa</span>
                      </button>
                      <button class="btn btn-sm btn-expand btn-purple me-2" (click)="onEdit(row)">
                        <i class="bi bi-pencil-square"></i>
                        <span class="btn-label">Editar</span>
                      </button>
                      <button class="btn btn-sm btn-expand btn-primary" (click)="onDelete(row)">
                        <i class="bi bi-trash-fill"></i>
                        <span class="btn-label">Eliminar</span>
                      </button>
                    </div>
                </ng-template>
              </ngx-datatable-column>

          </ngx-datatable>
      </div>
    </div>

    
  </div>
</div>
